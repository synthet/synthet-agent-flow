<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="flow-token" content="__FLOW_TOKEN__">
<meta name="flow-actor" content="__FLOW_ACTOR__">
<title>Agent Flow</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="shell">
  <div class="brand">
    <a class="brand-link" id="home-link" href="#/" title="All projects">
      <svg class="brand-mark" width="18" height="18" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="7" height="22" rx="2" fill="currentColor"/><rect x="12.5" y="5" width="7" height="15" rx="2" fill="currentColor" opacity=".7"/><rect x="22" y="5" width="7" height="9" rx="2" fill="currentColor" opacity=".45"/></svg>
      <span class="brand-name">Agent Flow</span>
    </a>
    <select id="ws-select" class="ws-select" aria-label="Project"></select>
  </div>
  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-view="board" class="tab">Board</button>
    <button role="tab" data-view="review" class="tab">Review <span class="count" id="review-count"></span></button>
    <button role="tab" data-view="activity" class="tab">Activity</button>
    <button role="tab" data-view="agents" class="tab">Agents</button>
    <button role="tab" data-view="epics" class="tab">Epics</button>
    <button role="tab" data-view="stats" class="tab">Stats</button>
  </nav>
  <div class="shell-right">
    <span class="live" id="live" title="live updates"><span class="dot"></span><span id="live-text">connecting</span></span>
    <button class="btn primary" id="new-ticket" aria-label="New ticket"><span class="plus">+</span><span class="wide">New ticket</span></button>
  </div>
</header>
<div class="toolbar" id="toolbar">
  <input id="search" type="search" placeholder="Filter: text, id, @owner, #label" aria-label="Filter tickets">
  <label>Swimlanes
    <select id="swimlane">
      <option value="none">None</option>
      <option value="lane">Lane</option>
      <option value="priority">Priority</option>
      <option value="epic">Epic</option>
      <option value="owner">Owner</option>
    </select>
  </label>
  <label class="check"><input type="checkbox" id="show-backlog" checked> Backlog</label>
  <label class="check"><input type="checkbox" id="show-done" checked> Done</label>
  <span class="spacer"></span>
  <label>You are <input id="actor" class="actor-input" spellcheck="false" aria-label="Your actor id"></label>
</div>
<main id="main">
  <section class="view" id="view-home" hidden></section>
  <section class="view" id="view-board" hidden></section>
  <section class="view" id="view-review" hidden></section>
  <section class="view" id="view-activity" hidden></section>
  <section class="view" id="view-agents" hidden></section>
  <section class="view" id="view-epics" hidden></section>
  <section class="view" id="view-stats" hidden></section>
</main>
<aside class="drawer" id="drawer" hidden aria-label="Ticket details"></aside>
<div class="modal-backdrop" id="modal" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
